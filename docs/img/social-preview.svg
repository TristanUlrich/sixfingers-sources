<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="640" viewBox="0 0 1280 640" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">
  <rect width="1280" height="640" fill="#0d0b0a"/>
  <rect x="0" y="0" width="1280" height="640" fill="none" stroke="#1a1714" stroke-width="2"/>

  <!-- a row of seven washing-machine drums, one per model, in the machine colours -->
  <g>
    <g transform="translate(205,150)"><circle r="56" fill="#1a1714" stroke="#5aa8d8" stroke-width="5"/><circle r="34" fill="#0d0b0a"/></g>
    <g transform="translate(360,150)"><circle r="56" fill="#1a1714" stroke="#6cc63a" stroke-width="5"/><circle r="34" fill="#0d0b0a"/></g>
    <g transform="translate(515,150)"><circle r="56" fill="#1a1714" stroke="#e05a96" stroke-width="5"/><circle r="34" fill="#0d0b0a"/></g>
    <g transform="translate(670,150)"><circle r="56" fill="#1a1714" stroke="#e8913f" stroke-width="5"/><circle r="34" fill="#0d0b0a"/></g>
    <g transform="translate(825,150)"><circle r="56" fill="#1a1714" stroke="#3fb8c8" stroke-width="5"/><circle r="34" fill="#0d0b0a"/></g>
    <g transform="translate(980,150)"><circle r="56" fill="#1a1714" stroke="#d0473a" stroke-width="5"/><circle r="34" fill="#0d0b0a"/></g>
    <g transform="translate(1075,150)" opacity="0"></g>
    <g transform="translate(1135,150)"><circle r="56" fill="#1a1714" stroke="#aab0b6" stroke-width="5"/><circle r="34" fill="#0d0b0a"/></g>
  </g>

  <!-- title -->
  <text x="640" y="370" text-anchor="middle" fill="#f3ead6" font-size="118" font-weight="800" letter-spacing="2">SIXFINGERS</text>
  <rect x="470" y="392" width="340" height="7" rx="3" fill="#ff5c9a"/>

  <!-- one-line description -->
  <text x="640" y="452" text-anchor="middle" fill="#c9bfab" font-size="31">A laundromat for prompts: write one, pick a washing machine,</text>
  <text x="640" y="492" text-anchor="middle" fill="#c9bfab" font-size="31">and six AI pictures burst out of the door.</text>

  <!-- proof chips -->
  <g font-size="25" font-weight="600">
    <g transform="translate(355,545)"><rect width="176" height="52" rx="26" fill="#14120f" stroke="#3a3530"/><text x="88" y="34" text-anchor="middle" fill="#f3ead6">7 machines</text></g>
    <g transform="translate(547,545)"><rect width="210" height="52" rx="26" fill="#14120f" stroke="#3a3530"/><text x="105" y="34" text-anchor="middle" fill="#f3ead6">0 dependencies</text></g>
    <g transform="translate(773,545)"><rect width="152" height="52" rx="26" fill="#14120f" stroke="#3a3530"/><text x="76" y="34" text-anchor="middle" fill="#f3ead6">AI Horde</text></g>
  </g>

  <!-- footer -->
  <text x="640" y="628" text-anchor="middle" font-size="24"><tspan fill="#ff5c9a" font-weight="700">sixfingers.art</tspan><tspan fill="#6f675b">   ·   by Tristan Ulrich</tspan></text>
</svg>
