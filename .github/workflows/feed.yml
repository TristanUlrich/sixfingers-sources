# LE ROBOT QUI FABRIQUE LE FEED
#
# À déposer dans le dépôt PUBLIC `TristanUlrich/sixfingers-sources`, à
# `.github/workflows/feed.yml`. Il n'a rien à faire dans le dépôt du site.
#
# ------------------------------------------------------------------------------
# CE QU'IL FAIT, ET POURQUOI IL EXISTE
# ------------------------------------------------------------------------------
#
# Tristan veut que ce qui se passe sur GitHub apparaisse chez les gens : une
# machine acceptée doit arriver sur l'écran des autres, avec ses votes et le
# nombre de commentaires, sans redéployer le site.
#
# Le site ne peut pas interroger GitHub lui-même. Mesuré le 25 août 2026 :
# l'API sans clé plafonne à **60 requêtes par heure et par adresse IP** — pas par
# visiteur, par sortie réseau. Un lycée entier partage ce budget. Une page qui
# demanderait à GitHub tomberait en panne aux heures de monde, par intermittence,
# sans rien dire.
#
# Alors c'est CE robot qui interroge GitHub — il a un jeton, donc 5000 requêtes à
# l'heure — et il écrit **un seul fichier**, `feed.json`, que le site lit sur
# `raw.githubusercontent.com` : CORS ouvert, cache cinq minutes, aucun plafond qui
# compte. Une requête par personne, quel que soit le nombre de machines.
#
# ------------------------------------------------------------------------------
# QUAND IL SE RÉVEILLE
# ------------------------------------------------------------------------------
#
# À chaque fois que quelque chose bouge — une fiche fusionnée, une réaction, un
# commentaire — et une fois par heure en filet de sécurité. Ce qui est publié
# apparaît donc chez tout le monde en une minute environ.
#
# ------------------------------------------------------------------------------
# CE QU'IL NE FAIT PAS, ET C'EST LE PLUS IMPORTANT
# ------------------------------------------------------------------------------
#
#   - il n'exécute JAMAIS ce qui est proposé. Il lit du JSON et compte des
#     réactions. Rien de ce qui vient d'un inconnu n'est évalué, ni interprété ;
#   - il n'utilise PAS `pull_request_target`, qui donnerait un jeton d'écriture à
#     du code venu d'une branche étrangère. C'est la faute classique des actions,
#     et elle donne le dépôt à qui la trouve ;
#   - ses permissions sont **minimales** : lire le contenu, écrire le contenu (pour
#     le seul `feed.json`), et rien d'autre ;
#   - il ne décide de rien. Une fiche n'entre dans `sources/` que parce que
#     Tristan a fusionné une proposition à la main. Le robot ne fait que compter.
#
# ------------------------------------------------------------------------------
# ET CÔTÉ SITE
# ------------------------------------------------------------------------------
#
# Tout ce que ce fichier écrit **repasse par les 60 vérifications** dans le
# navigateur, exactement comme une fiche collée à la main (`sources.feed()`), et
# **rien n'est utilisé sans que la personne ait vu l'écran de consentement**. Ce
# fichier raccourcit le chemin ; il n'ouvre pas une deuxième porte.

name: feed

on:
  push:
    branches: [main]
    paths: ['sources/**']
  discussion:
    types: [created, edited, deleted]
  discussion_comment:
    types: [created, deleted]
  schedule:
    - cron: '17 * * * *'      # une fois par heure, en filet
  workflow_dispatch:

# LE STRICT MINIMUM, ET PAS MOINS QUE LE MINIMUM.
# Un bloc `permissions` REMPLACE les permissions par défaut : tout ce qui n'y est
# pas écrit est retiré. La première version ne portait que `contents: write`, donc
# le robot n'avait pas le droit de LIRE les discussions — la requête GraphQL
# échouait en silence, le `except` la rattrapait, et le feed sortait parfaitement
# valide avec zéro publication et zéro vote. Une panne muette, la pire espèce.
# `discussions: read` est donc là, et c'est tout ce qui a été ajouté : toujours
# pas d'`issues: write`, toujours pas de `pull-requests: write`.
permissions:
  contents: write
  discussions: read

concurrency:
  group: feed
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Compter les votes et rassembler les fiches
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          python3 - <<'PY'
          import json, os, pathlib, subprocess, datetime

          REPO = os.environ['REPO']

          def gh(query, **vars):
              """Une requête GraphQL, avec le jeton de l'action."""
              args = ['gh', 'api', 'graphql', '-f', 'query=' + query]
              for k, v in vars.items():
                  args += ['-F', f'{k}={v}']
              return json.loads(subprocess.check_output(args))

          owner, name = REPO.split('/')

          # Les discussions, leurs réactions et leur nombre de commentaires.
          # Une seule requête pour cent : c'est tout l'intérêt de GraphQL ici.
          # `bodyText` et pas `body` : le TEXTE, pas le Markdown. Le site ne rend
          # jamais de balisage venu d'un inconnu, donc autant ne pas le transporter.
          # Et un extrait, pas le message entier : le fichier doit rester petit,
          # et on lit la suite chez GitHub.
          # `isMinimized` EST LE CHAMP QUI MANQUAIT, ET C'ETAIT LE TROU.
          # Masquer un commentaire sur GitHub — « Hide as spam », « Hide as abusive » —
          # met `isMinimized` a vrai et ne supprime rien. Le robot ne le lisait pas :
          # Tristan pouvait donc moderer sur GitHub, voir le commentaire disparaitre
          # de la page GitHub, et le site continuait de l'afficher a tout le monde.
          # Une moderation qui a l'air d'avoir marche et qui n'a rien fait, c'est la
          # panne la plus chere de ce projet, et celle-la aurait porte sur des mots
          # ecrits par des inconnus.
          #
          # On demande cinq de plus que les trois qu'on garde, parce que les
          # masques se retirent APRES coup : sans marge, cacher un commentaire
          # ferait disparaitre une ligne au lieu de la remplacer par la suivante.
          #
          # `avatarUrl` est parti : le site dessine le visage a partir du pseudo.
          # Il etait charge depuis avatars.githubusercontent.com, ce que le CSP
          # interdit, et le garder aurait dit a GitHub qui lit le mur.
          Q = """
          query($owner:String!, $name:String!) {
            repository(owner:$owner, name:$name) {
              discussions(first:100, orderBy:{field:UPDATED_AT, direction:DESC}) {
                nodes {
                  number title url bodyText createdAt locked
                  category { name emoji }
                  author { login }
                  comments(last:8) {
                    totalCount
                    nodes { bodyText createdAt isMinimized author { login } }
                  }
                  reactionGroups { content reactors { totalCount } }
                }
              }
            }
          }"""
          try:
              data = gh(Q, owner=owner, name=name)
              nodes = data['data']['repository']['discussions']['nodes']
          except Exception as e:
              print('pas de discussions lisibles:', e)
              nodes = []

          def clip(t, n):
              t = ' '.join((t or '').split())
              return t[:n]

          # ------------------------------------------------------------------
          # L'INTERRUPTEUR, ET IL NE SAIT QUE CACHER
          # ------------------------------------------------------------------
          #
          # `moderation.json` a la racine du depot. Tristan y met un numero de
          # discussion ou un pseudo, il committe, et c'est parti du site a la
          # minute suivante. Pas de deploiement, pas de mot de passe, pas moi.
          #
          # Il ne peut RIEN AJOUTER. C'est la borne posee dans DECISIONS.md : un
          # fichier qui peut faire apparaitre du texte sur l'ecran des gens est un
          # fichier qu'il faut garder comme un secret. Celui-ci ne peut que
          # retrancher, donc le pire qu'une erreur puisse faire est un mur vide.
          #
          # Il est FACULTATIF : s'il n'existe pas, on ne cache rien et on le dit.
          hidden_n, hidden_who = set(), set()
          try:
              mod = json.loads(pathlib.Path('moderation.json').read_text())
              hidden_n = {int(x) for x in (mod.get('hidden_discussions') or [])
                          if isinstance(x, (int, str)) and str(x).isdigit()}
              hidden_who = {str(x).lower() for x in (mod.get('hidden_logins') or [])
                            if isinstance(x, str) and x.strip()}
              print('moderation :', len(hidden_n), 'discussion(s),',
                    len(hidden_who), 'pseudo(s) caches')
          except FileNotFoundError:
              print('moderation : pas de fichier, rien de cache')
          except Exception as e:
              # Un fichier illisible ne doit pas cacher tout le mur par accident,
              # mais il ne doit pas non plus passer inapercu.
              print('moderation : FICHIER ILLISIBLE, rien de cache :', e)

          # Une discussion appartient à une fiche si son titre est « source: <id> ».
          # Toutes les autres sont des PUBLICATIONS du fil.
          def keep_last(nodes_):
              """Les trois derniers commentaires AFFICHABLES, pas les trois derniers.

              Un commentaire masque sur GitHub ne doit pas voyager, et un pseudo
              coupe non plus. On en demande huit et on en garde trois : sans cette
              marge, cacher un commentaire ferait un trou au lieu d'une ligne de
              moins."""
              global cache_c
              out = []
              for c in nodes_:
                  if c.get('isMinimized'):
                      cache_c += 1
                      continue
                  w = ((c.get('author') or {}).get('login') or '')
                  if w.lower() in hidden_who:
                      cache_c += 1
                      continue
                  t = clip(c.get('bodyText'), 300)
                  if not w or not t:
                      continue
                  out.append({'by': w[:40], 'text': t, 'at': c.get('createdAt')})
              return out[-3:]

          by_id = {}
          posts = []
          cache_d, cache_c = 0, 0
          for d in nodes:
              title = (d.get('title') or '').strip()
              groups = {g['content']: g['reactors']['totalCount'] for g in d['reactionGroups']}
              author = d.get('author') or {}
              cm = d.get('comments') or {}

              # L'interrupteur, d'abord : une discussion cachee ne laisse rien
              # derriere elle, pas meme son compte de votes.
              who = (author.get('login') or '').lower()
              if d.get('number') in hidden_n or (who and who in hidden_who):
                  cache_d += 1
                  continue

              if title.lower().startswith('source:'):
                  sid = title.split(':', 1)[1].strip()
                  by_id[sid] = {
                      'up': groups.get('THUMBS_UP', 0),
                      'down': groups.get('THUMBS_DOWN', 0),
                      'comments': cm.get('totalCount', 0),
                      'discuss': d['url'],
                  }
                  # Une fiche a AUSSI sa place dans le fil : « quelqu'un a propose
                  # une machine » est exactement le genre de nouvelle qu'on vient
                  # lire. Elle y entre avec son type, pour que le site la dessine
                  # autrement.
                  kind = 'source'
              else:
                  kind = 'post'

              posts.append({
                  'kind': kind,
                  'n': d['number'],
                  'title': clip(title, 140),
                  'url': d['url'],
                  'text': clip(d.get('bodyText'), 700),
                  'at': d.get('createdAt'),
                  'category': ((d.get('category') or {}).get('name') or '')[:40],
                  'by': (author.get('login') or '')[:40],
                  'likes': groups.get('THUMBS_UP', 0) + groups.get('HEART', 0),
                  'comments': cm.get('totalCount', 0),
                  'last': keep_last(cm.get('nodes') or []),
              })

          items = []
          # Le fichier d'exemple est une DOCUMENTATION, pas une machine : son
          # adresse ne repond pas, et il est la pour montrer la forme d'une fiche.
          # Le laisser entrer dans le feed le ferait apparaitre comme une vraie
          # proposition, et la premiere personne qui appuierait sur « Try it »
          # aurait raison de croire que le catalogue est cassé.
          for f in sorted(pathlib.Path('sources').glob('*.json')):
              if f.name.startswith('example-'):
                  print('exemple ignore:', f.name)
                  continue
              try:
                  src = json.loads(f.read_text())
              except Exception as e:
                  print('fiche illisible, ignorée:', f, e)
                  continue
              sid = src.get('id') or f.stem
              v = by_id.get(sid, {})
              # `by` : le dernier à avoir touché le fichier. Factuel, pas déclaratif.
              try:
                  who = subprocess.check_output(
                      ['git', 'log', '-1', '--format=%an', '--', str(f)]).decode().strip()
              except Exception:
                  who = ''
              try:
                  when = subprocess.check_output(
                      ['git', 'log', '-1', '--format=%aI', '--', str(f)]).decode().strip()
              except Exception:
                  when = ''
              items.append({
                  'source': src,
                  'by': who[:40],
                  'up': int(v.get('up', 0)),
                  'down': int(v.get('down', 0)),
                  'comments': int(v.get('comments', 0)),
                  'discuss': v.get('discuss'),
                  'at': when,
              })

          out = {
              'generated': datetime.datetime.now(datetime.timezone.utc)
                              .isoformat(timespec='seconds').replace('+00:00', 'Z'),
              'items': items,
              'posts': posts,
          }
          pathlib.Path('feed.json').write_text(json.dumps(out, indent=1) + '\n')
          print('feed.json :', len(items), 'machines,', len(posts), 'publications')
          print('cache :', cache_d, 'discussion(s),', cache_c, 'commentaire(s)')
          PY

      - name: Le publier, mais seulement s'il a changé
        run: |
          git config user.name  "sixfingers-bot"
          git config user.email "bot@users.noreply.github.com"
          git add feed.json
          # `--quiet --exit-code` : pas de commit vide toutes les heures, ce qui
          # remplirait l'historique d'un bruit qui cacherait les vrais changements.
          if git diff --cached --quiet; then
            echo "rien n'a bougé"
          else
            git commit -m "feed: recompte"
            git push
          fi
