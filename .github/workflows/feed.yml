# THE ROBOT THAT BUILDS THE WALL
#
# It lives in the PUBLIC repository, at `.github/workflows/feed.yml`. It has no
# business being in the site's repository.
#
# ------------------------------------------------------------------------------
# WHAT IT DOES, AND WHY IT EXISTS
# ------------------------------------------------------------------------------
#
# What happens on GitHub has to show up on people's screens: an accepted machine
# should appear for everybody, with its votes and its comment count, without
# redeploying the site.
#
# The site cannot ask GitHub itself. Measured on 25 August 2026: the API without a
# key is capped at **60 requests an hour PER IP ADDRESS**, which is not per visitor
# but per exit point. A whole school shares that budget. A page that asked GitHub
# at load time would fail at busy hours, intermittently, and silently.
#
# So THIS robot asks GitHub, with a token and therefore 5000 requests an hour, and
# writes **one file**, `feed.json`, which the site reads from
# `raw.githubusercontent.com`: CORS open, a five minute cache, no ceiling that
# matters. One request per reader, however many machines there are.
#
# ------------------------------------------------------------------------------
# WHEN IT WAKES UP
# ------------------------------------------------------------------------------
#
# Every time something moves: a record merged, a reaction, a comment. Plus once an
# hour as a safety net. What gets published therefore appears for everybody in
# about a minute.
#
# ------------------------------------------------------------------------------
# WHAT IT DOES NOT DO, AND THAT IS THE IMPORTANT HALF
# ------------------------------------------------------------------------------
#
#   - it NEVER runs what was proposed. It reads JSON and counts reactions. Nothing
#     coming from a stranger is evaluated or interpreted;
#   - it does NOT use `pull_request_target`, which would hand a write token to code
#     from a stranger's branch. That is the classic Actions mistake, and it gives
#     the repository away to whoever finds it;
#   - its permissions are **minimal**: read contents, write contents (for
#     `feed.json` alone), and nothing else;
#   - it decides nothing. A record enters `sources/` only because a human merged a
#     proposal by hand. The robot only counts.
#
# ------------------------------------------------------------------------------
# AND ON THE SITE'S SIDE
# ------------------------------------------------------------------------------
#
# Everything this file writes **goes back through the 60 checks** in the browser,
# exactly like a record pasted by hand (`sources.feed()`), and **nothing is used
# before the person has seen the consent screen**. This file shortens the road; it
# does not open a second door.

name: feed

on:
  push:
    branches: [main]
    paths: ['sources/**']
  discussion:
    types: [created, edited, deleted]
  discussion_comment:
    types: [created, deleted]
  schedule:
    - cron: '17 * * * *'      # once an hour, as a safety net
  workflow_dispatch:

# THE BARE MINIMUM, AND NOT ONE PERMISSION LESS.
# A `permissions:` block REPLACES the defaults: whatever is not written here is
# taken away. The first version carried only `contents: write`, so the robot was
# not allowed to READ the discussions. The GraphQL request failed silently, the
# `except` caught it, and the feed came out perfectly valid with zero posts and
# zero votes. A silent failure, the worst kind. `discussions: read` is therefore
# here, and it is all that was added: still no `issues: write`, still no
# `pull-requests: write`.
permissions:
  contents: write
  discussions: read

concurrency:
  group: feed
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Count the votes and gather the records
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          python3 - <<'PY'
          import json, os, pathlib, subprocess, datetime

          REPO = os.environ['REPO']

          def gh(query, **vars):
              """Une requête GraphQL, avec le jeton de l'action."""
              args = ['gh', 'api', 'graphql', '-f', 'query=' + query]
              for k, v in vars.items():
                  args += ['-F', f'{k}={v}']
              return json.loads(subprocess.check_output(args))

          owner, name = REPO.split('/')

          # The discussions, their reactions and their comment counts.
          # One request instead of a hundred: that is the whole point of GraphQL here.
          # `bodyText` and not `body`: the TEXT, not the Markdown. The site never
          # renders markup written by a stranger, so there is no reason to carry it.
          # And an extract, not the whole message: this file has to stay small, and
          # the rest is read on GitHub.
          #
          # `isMinimized` IS THE FIELD THAT WAS MISSING, AND IT WAS THE HOLE.
          # Hiding a comment on GitHub, with "Hide as spam" or "Hide as abusive",
          # sets `isMinimized` to true and deletes nothing. The robot did not read
          # it, so a comment could be moderated on GitHub, vanish from the GitHub
          # page, and still be shown to everybody by the site. Moderation that looks
          # like it worked and did nothing is the most expensive failure in this
          # project, and this one would have applied to words written by strangers.
          #
          # Five more comments are asked for than the three that are kept, because
          # hiding happens AFTER the fact: without that margin, hiding one comment
          # would leave a gap instead of promoting the next one.
          #
          # `avatarUrl` is gone: the site draws the face from the account name. It
          # used to be loaded from avatars.githubusercontent.com, which the site's
          # Content Security Policy forbids, and keeping it would have told GitHub
          # who reads the wall.
          Q = """
          query($owner:String!, $name:String!) {
            repository(owner:$owner, name:$name) {
              discussions(first:100, orderBy:{field:UPDATED_AT, direction:DESC}) {
                nodes {
                  number title url bodyText createdAt locked
                  category { name emoji }
                  author { login }
                  comments(last:8) {
                    totalCount
                    nodes { bodyText createdAt isMinimized author { login } }
                  }
                  reactionGroups { content reactors { totalCount } }
                }
              }
            }
          }"""
          try:
              data = gh(Q, owner=owner, name=name)
              nodes = data['data']['repository']['discussions']['nodes']
          except Exception as e:
              print('no readable discussions:', e)
              nodes = []

          def clip(t, n):
              t = ' '.join((t or '').split())
              return t[:n]

          # ------------------------------------------------------------------
          # THE OFF SWITCH, AND IT ONLY KNOWS HOW TO HIDE
          # ------------------------------------------------------------------
          #
          # `moderation.json`, at the root of this repository. Put a discussion
          # number or an account name in it, commit, and it is gone from the site
          # within the minute. No deployment, no password, nobody else involved.
          #
          # It can ADD NOTHING. That is the boundary set in the project's decisions:
          # a file that can make text appear on somebody's screen is a file that has
          # to be guarded like a secret. This one can only take away, so the worst a
          # mistake can do is an empty wall.
          #
          # It is OPTIONAL: with no file, nothing is hidden, and the log says so.
          hidden_n, hidden_who = set(), set()
          try:
              mod = json.loads(pathlib.Path('moderation.json').read_text())
              hidden_n = {int(x) for x in (mod.get('hidden_discussions') or [])
                          if isinstance(x, (int, str)) and str(x).isdigit()}
              hidden_who = {str(x).lower() for x in (mod.get('hidden_logins') or [])
                            if isinstance(x, str) and x.strip()}
              print('moderation:', len(hidden_n), 'discussion(s),',
                    len(hidden_who), 'account name(s) hidden')
          except FileNotFoundError:
              print('moderation: no file, nothing hidden')
          except Exception as e:
              # An unreadable file must not hide the whole wall by accident, and
              # it must not go unnoticed either.
              print('moderation: FILE UNREADABLE, nothing hidden:', e)

          # A discussion belongs to a record when its title reads "source: <id>".
          # Every other discussion is a POST on the wall.
          def keep_last(nodes_):
              """The last three SHOWABLE comments, not the last three.

              A comment hidden on GitHub must not travel, and neither must anything
              written by a hidden account. Eight are asked for and three are kept:
              without that margin, hiding one comment would leave a gap instead of
              one line fewer."""
              global cache_c
              out = []
              for c in nodes_:
                  if c.get('isMinimized'):
                      cache_c += 1
                      continue
                  w = ((c.get('author') or {}).get('login') or '')
                  if w.lower() in hidden_who:
                      cache_c += 1
                      continue
                  t = clip(c.get('bodyText'), 300)
                  if not w or not t:
                      continue
                  out.append({'by': w[:40], 'text': t, 'at': c.get('createdAt')})
              return out[-3:]

          by_id = {}
          posts = []
          cache_d, cache_c = 0, 0
          for d in nodes:
              title = (d.get('title') or '').strip()
              groups = {g['content']: g['reactors']['totalCount'] for g in d['reactionGroups']}
              author = d.get('author') or {}
              cm = d.get('comments') or {}

              # The off switch first: a hidden discussion leaves nothing behind,
              # not even its vote count.
              who = (author.get('login') or '').lower()
              if d.get('number') in hidden_n or (who and who in hidden_who):
                  cache_d += 1
                  continue

              if title.lower().startswith('source:'):
                  sid = title.split(':', 1)[1].strip()
                  by_id[sid] = {
                      'up': groups.get('THUMBS_UP', 0),
                      'down': groups.get('THUMBS_DOWN', 0),
                      'comments': cm.get('totalCount', 0),
                      'discuss': d['url'],
                  }
                  # A record belongs on the wall TOO: "somebody proposed a machine" is
                  # exactly the kind of news people come for. It enters with its type, so
                  # that the site can draw it differently.
                  kind = 'source'
              else:
                  kind = 'post'

              posts.append({
                  'kind': kind,
                  'n': d['number'],
                  'title': clip(title, 140),
                  'url': d['url'],
                  'text': clip(d.get('bodyText'), 700),
                  'at': d.get('createdAt'),
                  'category': ((d.get('category') or {}).get('name') or '')[:40],
                  'by': (author.get('login') or '')[:40],
                  'likes': groups.get('THUMBS_UP', 0) + groups.get('HEART', 0),
                  'comments': cm.get('totalCount', 0),
                  'last': keep_last(cm.get('nodes') or []),
              })

          items = []
          # The example file is DOCUMENTATION, not a machine: its address does not
          # answer, and it exists to show the shape of a record. Letting it into the
          # feed would make it look like a real proposal, and the first person to
          # press "Try it" would be right to think the catalogue was broken.
          for f in sorted(pathlib.Path('sources').glob('*.json')):
              if f.name.startswith('example-'):
                  print('exemple ignore:', f.name)
                  continue
              try:
                  src = json.loads(f.read_text())
              except Exception as e:
                  print('fiche illisible, ignorée:', f, e)
                  continue
              sid = src.get('id') or f.stem
              v = by_id.get(sid, {})
              # `by`: whoever last touched the file. A fact, not a claim.
              try:
                  who = subprocess.check_output(
                      ['git', 'log', '-1', '--format=%an', '--', str(f)]).decode().strip()
              except Exception:
                  who = ''
              try:
                  when = subprocess.check_output(
                      ['git', 'log', '-1', '--format=%aI', '--', str(f)]).decode().strip()
              except Exception:
                  when = ''
              items.append({
                  'source': src,
                  'by': who[:40],
                  'up': int(v.get('up', 0)),
                  'down': int(v.get('down', 0)),
                  'comments': int(v.get('comments', 0)),
                  'discuss': v.get('discuss'),
                  'at': when,
              })

          out = {
              'generated': datetime.datetime.now(datetime.timezone.utc)
                              .isoformat(timespec='seconds').replace('+00:00', 'Z'),
              'items': items,
              'posts': posts,
          }
          pathlib.Path('feed.json').write_text(json.dumps(out, indent=1) + '\n')
          print('feed.json :', len(items), 'machines,', len(posts), 'publications')
          print('cache :', cache_d, 'discussion(s),', cache_c, 'commentaire(s)')
          PY

      - name: Le publier, mais seulement s'il a changé
        run: |
          git config user.name  "sixfingers-bot"
          git config user.email "bot@users.noreply.github.com"
          git add feed.json
          # `--quiet --exit-code`: no empty commit every hour, which
          # would fill the history with noise and bury the real changes.
          if git diff --cached --quiet; then
            echo "rien n'a bougé"
          else
            git commit -m "feed: recompte"
            git push
          fi
