# Every proposal is checked before a human reads it.
#
# The point is not politeness: it means a source that breaks a rule is refused by
# the machine, in public, with the reason written out, so nobody has to argue about
# it and nothing gets waved through because it looked fine at a glance.
#
# Nothing is installed. The checker uses only the python3 that GitHub's runner
# already has, which is the same reason it runs on Tristan's Mac.

name: check sources

on:
  pull_request:
    paths:
      - 'sources/**'
      - 'tools/**'
      - '.github/workflows/check-sources.yml'
  push:
    branches: [main]
  workflow_dispatch:

# Read-only, and no token handed to the checked-out tree. A workflow that runs on
# a stranger's pull request should be able to do nothing but read.
permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      # GitHub's own action. `persist-credentials: false` keeps the runner's token
      # out of the working copy, so a malicious file in a proposal has no
      # credential sitting next to it.
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      # LA PREMIERE CHOSE, ET PAS LA DEUXIEME. Le 25 aout 2026 les deux
      # verificateurs ont diverge sans un bruit : le navigateur avait appris a
      # lire une fiche Horde, celui-ci non, et la seule vraie fiche de l etagere
      # etait refusee par la machine censee l accueillir. Trois poussees de
      # suite, rien en rouge nulle part. Cette etape passe donc en premier :
      # tant que les deux copies ne repondent pas la meme chose a la meme table,
      # savoir que les fiches passent ne veut rien dire.
      - name: the two validators must still agree on the same table
        run: python3 tools/check-cases.py

      # MEME DOCTRINE, DEUXIEME LISTE. Le garde-fou des mots est lui aussi ecrit
      # deux fois : `js/words.js` dans le site, `tools/words.py` ici. La liste
      # elle-meme n existe qu une fois, dans `tools/words.json`, et les deux
      # lecteurs repondent a la meme table. La moitie la plus importante de cette
      # table n est pas la liste d insultes : ce sont les vrais noms qui doivent
      # PASSER, Scunthorpe, Niger, Negre, Kike. Un garde-fou qui refuse le nom de
      # quelqu un fait bien plus de degats qu un mot qui passe.
      - name: the word guard must judge the same on both sides
        run: python3 tools/check-words.py

      # Le robot qui repond aux inconnus est la premiere chose qu ils rencontrent,
      # et il ecrit en public sous le nom du projet. Il est donc tenu a une table
      # ecrite, comme les validateurs : ce qu il repond a quinze propositions, et
      # deux regles sur toutes — il ne reimprime jamais un mot de la liste, et il
      # ne laisse jamais une cloture de bloc ouverte par laquelle une proposition
      # ecrirait du Markdown a sa place.
      - name: the robot must answer proposals the way the table says
        run: python3 tools/check-proposals.py

      - name: every source must pass the same rules as the site
        run: python3 tools/check-source.py sources/*.json

      - name: a source file must be named after the id inside it
        run: |
          fail=0
          for f in sources/*.json; do
            id=$(python3 -c "import json,sys;print(json.load(open(sys.argv[1])).get('id',''))" "$f")
            want="sources/$id.json"
            if [ "$f" != "$want" ]; then
              echo "$f declares id '$id', so it should be named $want"
              fail=1
            fi
          done
          exit $fail

      - name: no source may ask for a key
        run: |
          if grep -ril --include='*.json' -e 'authorization' -e 'api[_-]\?key' \
                 -e 'bearer' -e 'x-api' sources/; then
            echo "A source on this shelf works without an identifier. See CONTRIBUTING.md."
            exit 1
          fi
          echo "none of them do"
