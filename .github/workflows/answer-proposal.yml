# THE ROBOT THAT ANSWERS STRANGERS
#
# ------------------------------------------------------------------------------
# WHY IT EXISTS
# ------------------------------------------------------------------------------
#
# `check-sources.yml` runs on FILES. Somebody who fills in the "New picture
# machine" form has sent no file, so until 31 August 2026 nobody answered them at
# all: they wrote into the void and waited for a human to walk past.
#
# That was the widest hole left in the front door, and a silly one, because the
# answer was already written. The rules exist, they are public, and they take a
# machine one minute. This robot reads the record pasted into the form, puts it
# through the same checker as everything else, and replies in a comment with what
# passes and what does not. In public, so nobody has to argue about the verdict.
#
# ------------------------------------------------------------------------------
# WHAT IT DOES NOT DO, AND THAT IS THE IMPORTANT HALF
# ------------------------------------------------------------------------------
#
#   - it NEVER runs what was proposed. `json.loads` reads text and the rules judge
#     the object that comes out. Nothing is evaluated, nothing is imported, and no
#     address carried by the record is ever called;
#   - it does NOT use `pull_request_target`, which would hand a write token to code
#     coming from a stranger's branch. That is the classic Actions mistake, and it
#     gives the repository away to whoever finds it;
#   - it NEVER puts a stranger's text inside a command. The title, the body and the
#     account name travel as environment variables, never as `${{ ... }}` in the
#     middle of a `run:` block. That is exactly where a script injection gets in;
#   - it DECIDES nothing. It says whether the rules pass. Tristan reads everything,
#     and nothing enters `sources/` unless he merges it by hand.
#
# ------------------------------------------------------------------------------
# ONE COMMENT, REWRITTEN
# ------------------------------------------------------------------------------
#
# It also wakes up when the issue is EDITED, so a corrected record is read again
# straight away. It then rewrites its own comment instead of adding another: a
# conversation with fifteen stacked verdicts is unreadable, and only the last one
# counts.
#
# It recognises its own comment by TWO things: an invisible marker, and having
# written it itself (`user.type == "Bot"`). Without the second, anybody could paste
# the marker into a comment and have the robot rewrite the verdict for them.

name: answer proposals

on:
  issues:
    types: [opened, edited]

# THE BARE MINIMUM, AND A `permissions:` BLOCK REPLACES EVERYTHING: whatever is not
# written here is taken away. Write comments, read the repository, nothing else.
# No `contents: write`, so this robot can never push anything, ever.
permissions:
  issues: write
  contents: read

# A quick succession of edits must not put two robots on the same conversation:
# the last one is right, the earlier ones are cancelled.
concurrency:
  group: answer-proposal-${{ github.event.issue.number }}
  cancel-in-progress: true

jobs:
  answer:
    # Only machine proposals: a bug report is not judged by the record checker.
    #
    # TWO CONDITIONS, AND THE SECOND IS HERE BECAUSE THE FIRST ALREADY LIED ONCE.
    # The form declares `labels: ["new source"]`, but GitHub only applies labels
    # THAT ALREADY EXIST in the repository, and says nothing when one is missing.
    # It was missing. The very first proposal in this repository's history therefore
    # arrived with no label, the robot was skipped, and nothing was red anywhere.
    # The labels were created on 31 August 2026, and the robot no longer depends on
    # them alone: the heading "The source, as JSON" can only come from that form,
    # and nobody can delete it by accident in a settings page.
    if: >-
      contains(github.event.issue.labels.*.name, 'new source') ||
      contains(github.event.issue.body, '### The source, as JSON')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      # `persist-credentials: false` keeps the runner's token out of the working
      # copy, so nothing that was proposed ends up sitting next to a credential.
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Read the proposal, and write the answer
        id: judge
        env:
          ISSUE_BODY: ${{ github.event.issue.body }}
          ISSUE_TITLE: ${{ github.event.issue.title }}
          ISSUE_AUTHOR: ${{ github.event.issue.user.login }}
        run: |
          # The issue body is written to disk by python reading the environment,
          # never by `echo`: a body carrying quotes, newlines or a heredoc
          # terminator must not be able to touch the shell.
          python3 - <<'PY'
          import os
          with open('proposal-body.md', 'w', encoding='utf-8') as f:
              f.write(os.environ.get('ISSUE_BODY') or '')
          PY

          set +e
          python3 tools/read-proposal.py \
            --body-file proposal-body.md \
            --title "$ISSUE_TITLE" \
            --author "$ISSUE_AUTHOR" > proposal-reply.md
          code=$?
          set -e

          # 0 the record passes, 1 it is refused, 2 there was nothing to judge.
          # Anything else is the checker itself falling over, and that must show up
          # red rather than produce a verdict at random.
          if [ "$code" -gt 2 ]; then
            echo "the checker itself failed with code $code"
            exit 1
          fi
          echo "verdict: $code"
          echo "code=$code" >> "$GITHUB_OUTPUT"

      - name: Say it, once
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          NUMBER: ${{ github.event.issue.number }}
        run: |
          python3 - <<'PY'
          import json
          with open('proposal-reply.md', encoding='utf-8') as f:
              body = f.read()
          with open('payload.json', 'w', encoding='utf-8') as f:
              json.dump({'body': body}, f)
          PY

          mine=$(gh api "repos/$REPO/issues/$NUMBER/comments" --paginate --jq '
            [ .[]
              | select(.user.type == "Bot")
              | select(.body | contains("<!-- sixfingers: proposal checker -->"))
              | .id ] | first // empty')

          if [ -n "$mine" ]; then
            gh api -X PATCH "repos/$REPO/issues/comments/$mine" --input payload.json > /dev/null
            echo "rewrote comment $mine"
          else
            gh api -X POST "repos/$REPO/issues/$NUMBER/comments" --input payload.json > /dev/null
            echo "wrote a comment"
          fi

      # ----------------------------------------------------------------------
      # ET LE VERDICT SE VOIT DEPUIS LA LISTE
      #
      # Le commentaire dit tout, mais il faut ouvrir la conversation pour le lire.
      # Une liste de trente propositions ne disait donc rien du tout : il fallait
      # les ouvrir une par une pour savoir laquelle avait deja passe les regles.
      # Deux etiquettes reglent ca, et la liste se trie.
      #
      # Elles sont CREEES si elles manquent. Ce fichier porte deja la lecon en
      # haut : GitHub n'applique une etiquette que si elle existe deja, et ne dit
      # rien quand elle manque. Le premier robot de ce depot a ete saute pour
      # cette raison exacte. On ne suppose donc pas qu'elles sont la.
      #
      # Le nom n'a ni espace ni deux-points, pour qu'il traverse une adresse web
      # sans encodage : c'est le DELETE plus bas qui l'exige, et un bug d'encodage
      # dans un chemin est une facon idiote de laisser une etiquette fausse en
      # place.
      - name: Show the verdict on the list, not only in the conversation
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          NUMBER: ${{ github.event.issue.number }}
          CODE: ${{ steps.judge.outputs.code }}
        run: |
          make_label() {
            gh api -X POST "repos/$REPO/labels" \
              -f name="$1" -f color="$2" -f description="$3" > /dev/null 2>&1 || true
          }
          make_label 'checker-passed'  '0e8a16' 'The record passes every rule. A human still reads it.'
          make_label 'checker-refused' 'b60205' 'The record breaks a rule. The comment says which.'

          add()  { gh api -X POST "repos/$REPO/issues/$NUMBER/labels" -f "labels[]=$1" > /dev/null; }
          drop() { gh api -X DELETE "repos/$REPO/issues/$NUMBER/labels/$1" > /dev/null 2>&1 || true; }

          # 0 passe, 1 refuse, 2 il n'y avait rien a juger : dans ce dernier cas on
          # RETIRE les deux, sinon un verdict perime reste affiche sur une fiche
          # que la personne vient justement de vider en la corrigeant.
          case "$CODE" in
            0) drop 'checker-refused'; add 'checker-passed' ;;
            1) drop 'checker-passed';  add 'checker-refused' ;;
            *) drop 'checker-passed';  drop 'checker-refused' ;;
          esac
          echo "labelled for verdict $CODE"
